<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="theme-color" content="#1B2430">
<title>Chat Repuestos V10</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --bg: #ECEAE3;
    --panel: #FFFFFF;
    --ink: #1B2430;
    --ink-soft: #4B5563;
    --steel: #3B5C74;
    --steel-dark: #2A4356;
    --safety: #E8590C;
    --safety-dark: #C24A09;
    --line: #D8D5CB;
    --ok: #2F7D4F;
    --radius: 10px;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    padding-bottom: 40px;
  }

  /* ---------- Header ---------- */
  header{
    background: var(--ink);
    background-image: linear-gradient(160deg, var(--ink) 0%, var(--steel-dark) 100%);
    color: #fff;
    padding: 18px 16px 22px;
    position: sticky;
    top: 0;
    z-index: 20;
    box-shadow: 0 4px 14px rgba(0,0,0,0.18);
  }
  .header-row{
    display:flex;
    align-items:center;
    gap: 12px;
  }
  .mark{
    width: 42px; height: 42px;
    flex: none;
    border-radius: 8px;
    background: var(--safety);
    display:flex; align-items:center; justify-content:center;
    font-weight: 800;
    font-size: 18px;
    letter-spacing: -0.5px;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,0.25), 0 2px 6px rgba(0,0,0,0.3);
    color: #1B2430;
  }
  h1{
    margin:0;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: 0.3px;
    text-transform: uppercase;
  }
  .subtitle{
    margin: 1px 0 0;
    font-size: 12.5px;
    color: rgba(255,255,255,0.65);
    font-weight: 500;
  }

  /* ---------- Search ---------- */
  .search-wrap{
    margin-top: 14px;
    position: relative;
  }
  #search{
    width: 100%;
    padding: 14px 46px 14px 44px;
    border-radius: var(--radius);
    border: none;
    font-size: 16.5px;
    font-weight: 600;
    background: rgba(255,255,255,0.96);
    color: var(--ink);
    outline: none;
  }
  #search::placeholder{ color: #8B93A0; font-weight: 500; }
  .search-icon{
    position:absolute; left: 14px; top: 50%; transform: translateY(-50%);
    width: 18px; height:18px; opacity:0.55;
  }
  .clear-btn{
    position:absolute; right: 8px; top: 50%; transform: translateY(-50%);
    background: #DADFE4; color:#4B5563; border:none;
    width: 28px; height: 28px; border-radius: 50%;
    font-size: 16px; line-height: 1; cursor:pointer;
    display:none; align-items:center; justify-content:center;
  }
  .clear-btn.show{ display:flex; }

  /* ---------- Filter chips ---------- */
  .chips{
    display:flex; gap:8px; overflow-x:auto; margin-top: 12px;
    padding-bottom: 2px;
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{
    flex: none;
    padding: 7px 13px;
    border-radius: 999px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.18);
    color: rgba(255,255,255,0.85);
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.2px;
    text-transform: uppercase;
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
  }
  .chip.active{
    background: var(--safety);
    border-color: var(--safety);
    color: #1B2430;
  }

  /* ---------- Results ---------- */
  main{
    max-width: 640px;
    margin: 0 auto;
    padding: 16px;
  }
  .status-row{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom: 10px;
    padding: 0 2px;
  }
  #count{
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  .card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 14px 12px;
    margin-bottom: 10px;
    position: relative;
    animation: rise .18s ease;
  }
  @keyframes rise{ from{ opacity:0; transform: translateY(4px);} to{opacity:1; transform:none;} }

  .card-top{
    display:flex; justify-content:space-between; align-items:flex-start;
    gap: 10px;
  }
  .sap-tag{
    background: var(--ink);
    color: #fff;
    font-family: "SFMono-Regular", Consolas, Menlo, monospace;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.5px;
    padding: 6px 10px;
    border-radius: 6px;
    display:inline-flex;
    align-items:center;
    gap: 6px;
    border-bottom: 3px solid var(--safety);
  }
  .sap-tag small{
    font-family: -apple-system, sans-serif;
    font-weight: 700;
    font-size: 9px;
    opacity: 0.6;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .copy-icon{
    flex: none;
    border: 1px solid var(--line);
    background: #F4F3EF;
    color: var(--steel-dark);
    width: 34px; height: 34px;
    border-radius: 8px;
    cursor: pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .copy-icon.copied{
    background: var(--ok);
    color: #fff;
    border-color: var(--ok);
  }
  .copy-icon.inline{
    width: 20px; height: 20px;
    border-radius: 5px;
    border-color: transparent;
    background: rgba(59,92,116,0.12);
    vertical-align: -5px;
    margin-left: 2px;
  }

  .field-row{
    display:flex;
    align-items:flex-start;
    gap: 8px;
    margin: 10px 0 8px;
  }
  .desc{
    margin: 0;
    font-size: 14.5px;
    font-weight: 600;
    line-height: 1.35;
    color: var(--ink);
    flex: 1;
  }
  .meta-row{
    display:flex; flex-wrap:wrap; align-items:center; gap: 8px;
    font-size: 11.5px;
  }
  .meta{
    background: #EFF3F5;
    color: var(--steel-dark);
    padding: 4px 9px;
    border-radius: 6px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.2px;
    display:inline-flex;
    align-items:center;
  }
  .meta.tipo{ background: #FCEEE3; color: var(--safety-dark); }
  .meta.parte-meta{ gap: 4px; }

  .actions-row{
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .specs-toggle{
    flex: 1;
    min-width: 0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 6px;
    background: #EFF3F5;
    border: 1px solid var(--line);
    color: var(--steel-dark);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  .specs-toggle:active{ background: #E4EAED; }
  .specs-toggle .chev{
    width: 11px; height: 11px;
    transition: transform 0.15s ease;
    flex: none;
  }
  .specs-toggle.open .chev{ transform: rotate(180deg); }
  .specs-box{
    display: none;
    margin-top: 8px;
    padding: 10px 11px;
    background: #F4F3EF;
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  .specs-box.open{ display: block; }
  .specs-title{
    font-size: 10.5px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--steel-dark);
    margin: 0 0 6px;
  }
  .specs-grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px 10px;
  }
  .spec-row{
    font-size: 12.5px;
    line-height: 1.35;
  }
  .spec-label{
    color: var(--ink-soft);
    font-weight: 600;
  }
  .spec-value{
    color: var(--ink);
    font-weight: 700;
  }
  .specs-empty{
    margin: 0;
    font-size: 12.5px;
    color: var(--ink-soft);
    font-style: italic;
  }

  .foto-toggle{
    flex: 1;
    min-width: 0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 6px;
    background: #EAF0F5;
    border: 1px solid var(--line);
    color: var(--steel-dark);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  .foto-toggle:active{ background: #DCE6EC; }
  .foto-toggle svg{ flex: none; }

  .foto-overlay{
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15,20,26,0.94);
    z-index: 100;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .foto-overlay.open{ display: flex; }
  .foto-viewport{
    width: 100%;
    height: 78vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
  }
  .foto-image-wrap{
    position: relative;
    display: inline-flex;
    transform-origin: center center;
    will-change: transform;
    max-width: 100%;
    max-height: 78vh;
  }
  .foto-item-badge{
    position: absolute;
    top: 10px;
    left: 10px;
    background: var(--safety);
    color: var(--ink);
    font-weight: 700;
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 16px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    z-index: 5;
    display: none;
    white-space: nowrap;
  }
  .foto-item-badge.show{ display: block; }
  .foto-overlay img{
    display: block;
    max-width: 100%;
    max-height: 78vh;
    border-radius: 6px;
    background: #fff;
  }
  .foto-zoom-controls{
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
  }
  .foto-zoom-btn{
    min-width: 48px;
    height: 44px;
    padding: 0 14px;
    border-radius: 22px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .foto-zoom-btn:active{ background: rgba(255,255,255,0.22); }
  #fotoZoomReset{ font-size: 13px; font-weight: 700; }
  .foto-caption{
    color: rgba(255,255,255,0.85);
    font-size: 13px;
    text-align: center;
    margin-top: 12px;
    max-width: 520px;
    line-height: 1.4;
  }
  .foto-close{
    position: absolute;
    top: 18px;
    right: 18px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    font-size: 22px;
    line-height: 1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor: pointer;
  }

  mark{
    background: #FFE9A8;
    color: inherit;
    border-radius: 3px;
    padding: 0 1px;
  }

  .empty{
    text-align:center;
    padding: 60px 20px;
    color: var(--ink-soft);
  }
  .empty .big{
    font-size: 42px;
    margin-bottom: 6px;
  }
  .empty h3{ margin: 6px 0 4px; color: var(--ink); font-size: 16px; }
  .empty p{ margin: 0; font-size: 13.5px; line-height:1.4; }

  footer{
    text-align:center;
    font-size: 11px;
    color: #9CA3AF;
    padding: 18px 16px 4px;
  }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div class="mark">CR</div>
    <div>
      <h1>Chat Repuestos V10</h1>
      <p class="subtitle" id="dataInfo">Buscador de códigos de repuestos</p>
    </div>
  </div>

  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="#8B93A0" stroke-width="2.4" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input id="search" type="text" inputmode="search" autocomplete="off" autocorrect="off" autocapitalize="off"
           placeholder="Ej: cadena fruta, correa sacudidor, código SAP...">
    <button class="clear-btn" id="clearBtn" aria-label="Borrar busqueda">&times;</button>
  </div>

  <div class="chips" id="chips"></div>
</header>

<main>
  <div class="status-row">
    <span id="count"></span>
  </div>
  <div id="results"></div>
</main>

<div class="foto-overlay" id="fotoOverlay">
  <button class="foto-close" id="fotoClose" aria-label="Cerrar foto">&times;</button>
  <div class="foto-viewport" id="fotoViewport">
    <div class="foto-image-wrap" id="fotoImageWrap">
      <span class="foto-item-badge" id="fotoItemBadge"></span>
      <img id="fotoOverlayImg" src="" alt="Foto del repuesto">
    </div>
  </div>
  <div class="foto-zoom-controls">
    <button class="foto-zoom-btn" id="fotoZoomOut" aria-label="Alejar">&minus;</button>
    <button class="foto-zoom-btn" id="fotoZoomReset" aria-label="Restablecer zoom">100%</button>
    <button class="foto-zoom-btn" id="fotoZoomIn" aria-label="Acercar">&plus;</button>
  </div>
  <p class="foto-caption" id="fotoOverlayCaption"></p>
</div>

<footer>Chat Repuestos V10 &middot; Funciona sin conexión una vez cargada &middot; Datos locales, sin límite de consultas</footer>

const searchInput = document.getElementById('search');
const clearBtn = document.getElementById('clearBtn');
const resultsEl = document.getElementById('results');
const countEl = document.getElementById('count');
const chipsEl = document.getElementById('chips');
const dataInfo = document.getElementById('dataInfo');

let activeTipo = 'TODOS';

dataInfo.textContent = DATA.length + ' repuestos cargados';

// Sinónimos: normaliza jerga de taller a la palabra que aparece en la descripción.
// Se aplica sobre cada palabra escrita por el mecánico antes de comparar.
const SYNONYMS = {
  'fruta': ['fruta'],
  'grilla': ['grilla', 'zaranda', 'criba'],
  'palillos': ['palillos', 'dedos'],
  'sacudidor': ['sacudidor', 'zarandeo', 'shaker'],
  'correa': ['correa', 'banda'],
  'cadena': ['cadena'],
  'rodamiento': ['rodamiento', 'rulemán', 'ruleman', 'bearing'],
  'descarga': ['descarga', 'salida'],
  'terron': ['terron', 'terrón', 'piedra'],
  'aplaste': ['aplaste', 'compresion', 'compresión'],
  'cabezal': ['cabezal', 'header'],
  'ventilador': ['ventilador', 'fan'],
  'alternador': ['alternador'],
  'motor': ['motor', 'diesel'],
};

function norm(s){
  return (s || '').toString()
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .trim();
}

// Un token de búsqueda hace match si aparece literal en el texto,
// o si el texto contiene alguna palabra sinónima de ese token.
function tokenMatches(haystack, token){
  if(haystack.includes(token)) return true;
  for(const key in SYNONYMS){
    const group = SYNONYMS[key].map(norm);
    if(group.includes(token)){
      return group.some(syn => haystack.includes(syn));
    }
  }
  return false;
}

function buildChips(){
  const tipos = ['TODOS', ...new Set(DATA.map(d => d.tipo))];
  chipsEl.innerHTML = tipos.map(t =>
    `<div class="chip${t==='TODOS' ? ' active' : ''}" data-tipo="${t.replace(/"/g,'&quot;')}">${t}</div>`
  ).join('');
  chipsEl.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      activeTipo = chip.dataset.tipo;
      chipsEl.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      render();
    });
  });
}

// Resalta cualquiera de los tokens de búsqueda dentro del texto (pueden ser varios, en cualquier orden).
function highlight(text, tokens){
  const raw = (text || '').toString();
  if(!tokens || !tokens.length) return escapeHtml(raw);
  const normRaw = norm(raw);

  // arma lista de [inicio, fin] a resaltar, incluyendo variantes por sinónimo
  let ranges = [];
  tokens.forEach(tok => {
    const variants = new Set([tok]);
    for(const key in SYNONYMS){
      const group = SYNONYMS[key].map(norm);
      if(group.includes(tok)) group.forEach(v => variants.add(v));
    }
    variants.forEach(v => {
      if(!v) return;
      let from = 0, idx;
      while((idx = normRaw.indexOf(v, from)) !== -1){
        ranges.push([idx, idx + v.length]);
        from = idx + v.length;
      }
    });
  });
  if(!ranges.length) return escapeHtml(raw);

  ranges.sort((a,b) => a[0]-b[0]);
  const merged = [ranges[0]];
  for(let i=1;i<ranges.length;i++){
    const last = merged[merged.length-1];
    if(ranges[i][0] <= last[1]) last[1] = Math.max(last[1], ranges[i][1]);
    else merged.push(ranges[i]);
  }

  let out = '', cursor = 0;
  merged.forEach(([s,e]) => {
    out += escapeHtml(raw.slice(cursor, s));
    out += '<mark>' + escapeHtml(raw.slice(s, e)) + '</mark>';
    cursor = e;
  });
  out += escapeHtml(raw.slice(cursor));
  return out;
}

function escapeHtml(s){
  return (s||'').toString().replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}

function render(){
  const qRaw = searchInput.value.trim();
  const tokens = norm(qRaw).split(/\s+/).filter(Boolean);
  clearBtn.classList.toggle('show', qRaw.length > 0);

  let list = DATA;
  if(activeTipo !== 'TODOS'){
    list = list.filter(d => d.tipo === activeTipo);
  }
  if(tokens.length){
    list = list.filter(d => {
      const specsText = d.specs ? Object.values(d.specs).join(' ') : '';
      const haystack = norm([d.sap, d.parte, d.desc, d.tipo, specsText].join(' '));
      // cada palabra escrita debe encontrar coincidencia (directa o por sinónimo), en cualquier orden
      return tokens.every(tok => tokenMatches(haystack, tok));
    });
  }

  countEl.textContent = list.length + (list.length === 1 ? ' resultado' : ' resultados');

  if(list.length === 0){
    resultsEl.innerHTML = `
      <div class="empty">
        <div class="big">🔧</div>
        <h3>Sin resultados</h3>
        <p>No encontramos coincidencias.<br>Revisa el código o prueba con otra palabra.</p>
      </div>`;
    return;
  }

  resultsEl.innerHTML = list.map((d, i) => {
    const specsTextNorm = d.specs ? norm(Object.values(d.specs).join(' ')) : '';
    const mainHaystack = norm([d.sap, d.parte, d.desc, d.tipo].join(' '));
    const matchOnlyInSpecs = tokens.length > 0 && specsTextNorm &&
      !tokens.every(tok => tokenMatches(mainHaystack, tok)) &&
      tokens.every(tok => tokenMatches(mainHaystack + ' ' + specsTextNorm, tok));
    return `
    <div class="card">
      <div class="card-top">
        <span class="sap-tag"><small>SAP</small>${highlight(d.sap, tokens)}</span>
        <button class="copy-icon" data-value="${escapeHtml(d.sap)}" data-label="Código SAP" aria-label="Copiar código SAP">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"></path></svg>
        </button>
      </div>

      <div class="field-row">
        <p class="desc">${highlight(d.desc, tokens)}</p>
        <button class="copy-icon" data-value="${escapeHtml(d.desc)}" data-label="Descripción" aria-label="Copiar descripción">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"></path></svg>
        </button>
      </div>

      <div class="meta-row">
        <span class="meta tipo">${highlight(d.tipo, tokens)}</span>
        <span class="meta parte-meta">
          N° PARTE ${highlight(d.parte, tokens)}
          <button class="copy-icon inline" data-value="${escapeHtml(d.parte)}" data-label="N° de parte" aria-label="Copiar N° de parte">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"></path></svg>
          </button>
        </span>
      </div>

      ${(d.specs && Object.keys(d.specs).length) || d.foto ? `
      <div class="actions-row">
        ${d.specs && Object.keys(d.specs).length ? `
        <button class="specs-toggle${matchOnlyInSpecs ? ' open' : ''}" data-target="specs-${i}">
          <span class="btn-label">${matchOnlyInSpecs ? 'Ocultar especif.' : 'Especificaciones'}</span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>` : ''}
        ${d.foto ? `
        <button class="foto-toggle" data-foto="${escapeHtml(d.foto)}" data-caption="${escapeHtml(d.foto_ref || '')}" data-item="${escapeHtml(d.foto_item || '')}">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="11" r="2"></circle><path d="M21 16l-5-5-4 4-2-2-5 5"></path></svg>
          Foto
        </button>` : ''}
      </div>` : ''}

      ${d.specs && Object.keys(d.specs).length ? `
      <div class="specs-box${matchOnlyInSpecs ? ' open' : ''}" id="specs-${i}">
        <p class="specs-title">Especificaciones</p>
        <div class="specs-grid">
          ${Object.entries(d.specs).map(([label, value]) => `
            <div class="spec-row"><span class="spec-label">${escapeHtml(label)}:</span> <span class="spec-value">${highlight(value, tokens)}</span></div>
          `).join('')}
        </div>
      </div>` : ''}
    </div>
  `;
  }).join('');

  resultsEl.querySelectorAll('.foto-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      document.getElementById('fotoOverlayImg').src = btn.dataset.foto;
      document.getElementById('fotoOverlayCaption').textContent = btn.dataset.caption || '';
      document.getElementById('fotoOverlay').classList.add('open');
      const badge = document.getElementById('fotoItemBadge');
      if (btn.dataset.item) {
        badge.textContent = 'Buscá el N° ' + btn.dataset.item;
        badge.classList.add('show');
      } else {
        badge.classList.remove('show');
      }
      resetFotoZoom();
    });
  });

  resultsEl.querySelectorAll('.specs-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const box = document.getElementById(btn.dataset.target);
      const isOpen = box.classList.toggle('open');
      btn.classList.toggle('open', isOpen);
      btn.querySelector('.btn-label').textContent = isOpen ? 'Ocultar especificaciones' : 'Ver especificaciones';
    });
  });

  resultsEl.querySelectorAll('.copy-icon').forEach(btn => {
    btn.addEventListener('click', () => {
      const val = btn.dataset.value;
      const done = () => {
        btn.classList.add('copied');
        btn.innerHTML = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"></path></svg>';
        }, 1100);
      };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(val).then(done).catch(done);
      } else {
        const ta = document.createElement('textarea');
        ta.value = val;
        document.body.appendChild(ta);
        ta.select();
        try{ document.execCommand('copy'); }catch(e){}
        document.body.removeChild(ta);
        done();
      }
    });
  });
}

searchInput.addEventListener('input', render);
clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  searchInput.focus();
  render();
});

buildChips();
render();

const fotoOverlay = document.getElementById('fotoOverlay');
const fotoImg = document.getElementById('fotoOverlayImg');
const fotoImageWrap = document.getElementById('fotoImageWrap');
const fotoViewport = document.getElementById('fotoViewport');

let zoomScale = 1, panX = 0, panY = 0;
let startDist = 0, startScale = 1;
let isPanning = false, panStartX = 0, panStartY = 0, panOriginX = 0, panOriginY = 0;
let lastTapTime = 0;

function applyFotoTransform(){
  fotoImageWrap.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomScale})`;
  const label = document.getElementById('fotoZoomReset');
  if (label) label.textContent = Math.round(zoomScale * 100) + '%';
}

function resetFotoZoom(){
  zoomScale = 1; panX = 0; panY = 0;
  applyFotoTransform();
}

function clampScale(s){ return Math.min(4, Math.max(1, s)); }

document.getElementById('fotoZoomIn').addEventListener('click', () => {
  zoomScale = clampScale(zoomScale + 0.5);
  applyFotoTransform();
});
document.getElementById('fotoZoomOut').addEventListener('click', () => {
  zoomScale = clampScale(zoomScale - 0.5);
  if (zoomScale <= 1) { panX = 0; panY = 0; }
  applyFotoTransform();
});
document.getElementById('fotoZoomReset').addEventListener('click', () => {
  resetFotoZoom();
});

function touchDist(t1, t2){
  return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
}

fotoViewport.addEventListener('touchstart', (e) => {
  if(e.touches.length === 2){
    startDist = touchDist(e.touches[0], e.touches[1]);
    startScale = zoomScale;
    isPanning = false;
  } else if(e.touches.length === 1){
    const now = Date.now();
    if(now - lastTapTime < 300){
      // double tap: toggle zoom
      zoomScale = zoomScale > 1 ? 1 : 2.5;
      panX = 0; panY = 0;
      applyFotoTransform();
      lastTapTime = 0;
      return;
    }
    lastTapTime = now;
    if(zoomScale > 1){
      isPanning = true;
      panStartX = e.touches[0].clientX;
      panStartY = e.touches[0].clientY;
      panOriginX = panX;
      panOriginY = panY;
    }
  }
}, { passive: true });

fotoViewport.addEventListener('touchmove', (e) => {
  if(e.touches.length === 2){
    const dist = touchDist(e.touches[0], e.touches[1]);
    zoomScale = clampScale(startScale * (dist / startDist));
    applyFotoTransform();
  } else if(e.touches.length === 1 && isPanning){
    panX = panOriginX + (e.touches[0].clientX - panStartX);
    panY = panOriginY + (e.touches[0].clientY - panStartY);
    applyFotoTransform();
  }
}, { passive: true });

fotoViewport.addEventListener('touchend', () => {
  isPanning = false;
  if(zoomScale < 1.05){ zoomScale = 1; panX = 0; panY = 0; applyFotoTransform(); }
});

// desktop fallback: double-click to toggle zoom
fotoImg.addEventListener('dblclick', () => {
  zoomScale = zoomScale > 1 ? 1 : 2.5;
  panX = 0; panY = 0;
  applyFotoTransform();
});

document.getElementById('fotoClose').addEventListener('click', () => {
  fotoOverlay.classList.remove('open');
});
fotoOverlay.addEventListener('click', (e) => {
  if (e.target === fotoOverlay) fotoOverlay.classList.remove('open');
});
</script>
